<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique – Grades Minecraft | Build</title>
<meta name="description" content="Boutique Build : découvre les grades cosmétiques VIP, VIP+ et Légende pour nos serveurs Minecraft mini-jeux, Bedwars et PvP Faction.">
<link rel="canonical" href="https://VOTRE-PSEUDO.github.io/NOM-DU-REPO/boutique/">
<meta name="theme-color" content="#060b16">
<meta property="og:type" content="website"><meta property="og:locale" content="fr_FR"><meta property="og:site_name" content="Build">
<meta property="og:title" content="Boutique – Grades Minecraft | Build">
<meta property="og:description" content="Grades cosmétiques pour les serveurs Build : mini-jeux, Bedwars, PvP Faction.">
<meta property="og:url" content="https://VOTRE-PSEUDO.github.io/NOM-DU-REPO/boutique/">
<meta property="og:image" content="https://VOTRE-PSEUDO.github.io/NOM-DU-REPO/assets/og-image.png">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="../"><img src="../assets/logo.png" alt="Logo Build" width="42" height="42"><span id="siteName">Build</span></a>
  <nav aria-label="Navigation principale"><a href="../#serveurs">Serveurs</a><a href="../boutique/" aria-current="page" style="color:var(--tx)">Boutique</a><a href="../regles/">Règles</a><a href="../#rejoindre">Rejoindre</a><a href="../#discord">Discord</a></nav>
</div></header>
<main class="wrap pg">
  <h1>Boutique des grades</h1>
  <p class="lead" id="intro">Des grades cosmétiques pour soutenir tes serveurs préférés.</p>
  <div class="note" id="note" hidden></div>
  <div id="shop" aria-live="polite"></div>
  <p class="hint" style="margin-top:2rem">Avant d’acheter, lis les <a href="../regles/" style="color:#bfe6ff">règles du serveur</a>.</p>
</main>
<footer><div class="wrap">© <span id="yr"></span> <span id="ftName">Build</span>. Site non officiel, non affilié à Mojang Studios ni à Microsoft. Minecraft est une marque de Mojang Studios.</div></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('../data/site.json?'+Date.now()).then(r=>r.json()).then(D=>{
 $('#siteName').textContent=$('#ftName').textContent=D.name||'Build';$('#yr').textContent=new Date().getFullYear();
 const sh=D.shop||{},R=sh.ranks||[];
 if(sh.intro)$('#intro').textContent=sh.intro;
 if(sh.notice){$('#note').textContent=sh.notice;$('#note').hidden=false}
 const keys=['',...(D.servers||[]).map(s=>s.name)];R.forEach(r=>{if(!keys.includes(r.server||''))keys.push(r.server)});
 $('#shop').innerHTML=keys.map(k=>{const L=R.filter(r=>(r.server||'')===k);if(!L.length)return'';
  return `<div class="grp"><h2>${esc(k||'Tous les serveurs')}</h2><div class="ranks">${L.map(r=>`<article class="rank" style="--a:${esc(r.color||'#2bb4ff')}">
   <h3>${esc(r.name)}</h3><div class="price">${esc(r.price)}</div>
   <ul>${(r.perks||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
   ${/^https:\/\//.test(r.url||'')?`<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener sponsored">Acheter</a>`:'<span class="btn off" aria-disabled="true">Bientôt disponible</span>'}
  </article>`).join('')}</div></div>`}).join('')||'<p class="sub" style="margin-top:2rem">Aucun grade pour le moment.</p>';
}).catch(()=>{$('#shop').innerHTML='<p class="sub" style="margin-top:2rem">Impossible de charger la boutique. Recharge la page.</p>';$('#yr').textContent=new Date().getFullYear()});
</script>
</body>
</html>
